[pytest]
testpaths = tests
addopts = -ra -q --strict-markers
filterwarnings =
    ignore::DeprecationWarning
markers =
    migration: schema-migration contract tests (PR-15 + future migration PRs)
    tracker: tracker-matching contract tests (PR-58 -- auto-assign, cadence buckets, unread_count, scope-default min_relevance gate)
    network: hits a live external API; skipped in default CI (`-m "not network"`)
    slow: takes > 2 s; skipped in default CI (`-m "not slow"`)
